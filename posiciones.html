<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Posiciones — E.E.S.T. N°1 Bragado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <header class="bg-slate-900 text-white shadow-lg mb-8">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight">E.E.S.T. N°1 Bragado — Liga de Emprendimientos</h1>
        <p class="text-slate-400 text-xs">Tabla General de Posiciones • Popularidad e Inversión Semilla</p>
      </div>
      <span id="realtime-status" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full flex items-center gap-2">
        <i class="fa-solid fa-bolt"></i> En Vivo
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 space-y-8">

    <!-- SECCIÓN PODIO / TOP 3 VISUAL -->
    <section id="podio-container" class="grid grid-cols-1 md:grid-cols-3 gap-4 hidden">
      <!-- El podio se genera dinámicamente con JS -->
    </section>

    <!-- TABLA GENERAL -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-trophy text-amber-500"></i> Tabla General de Posiciones
        </h2>
        <button onclick="cargarTabla()" class="text-xs text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> Actualizar
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-600 uppercase text-[10px] tracking-wider font-bold">
            <tr>
              <th class="p-3 text-center">Pos</th>
              <th class="p-3">Emprendimiento</th>
              <th class="p-3 text-center">Votos Público</th>
              <th class="p-3 text-center">Promedio Público</th>
              <th class="p-3 text-right">Inversión Semilla</th>
              <th class="p-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-body" class="divide-y divide-slate-200">
            <tr>
              <td colspan="6" class="p-6 text-center text-slate-400 italic">Cargando tabla de posiciones...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://pwwnhxwkmchzkowiwein.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I8C3PrRipAaEfe-Gc_VgkA_2NCUw-Ga";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function cargarTabla() {
      const { data, error } = await _supabase.from('tabla_posiciones').select('*');

      if (error) {
        console.error("Error al cargar posiciones:", error);
        return;
      }

      const tbody = document.getElementById('tabla-body');
      const podioContainer = document.getElementById('podio-container');
      tbody.innerHTML = '';
      podioContainer.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-slate-400 italic">No hay emprendimientos registrados.</td></tr>';
        podioContainer.classList.add('hidden');
        return;
      }

      // Ordenar por inversión simulada y luego por promedio de público
      const ordenados = [...data].sort((a, b) => {
        const invA = parseFloat(a.total_inversion_simulada) || 0;
        const invB = parseFloat(b.total_inversion_simulada) || 0;
        if (invB !== invA) return invB - invA;
        
        const promA = parseFloat(a.promedio_publico) || 0;
        const promB = parseFloat(b.promedio_publico) || 0;
        return promB - promA;
      });

      // Renderizar Podio (Top 3)
      if (ordenados.length > 0) {
        podioContainer.classList.remove('hidden');
        const top3 = ordenados.slice(0, 3);
        
        let visualPodio = [];
        if (top3.length === 1) visualPodio = [top3[0]];
        else if (top3.length === 2) visualPodio = [top3[1], top3[0]];
        else visualPodio = [top3[1], top3[0], top3[2]];

        visualPodio.forEach((p) => {
          const posReal = ordenados.findIndex(item => item.proyecto_id === p.proyecto_id) + 1;
          let bgColor = "bg-white border-slate-200";
          let badgeColor = "bg-slate-100 text-slate-700";
          let icon = "fa-medal text-slate-400";

          if (posReal === 1) {
            bgColor = "bg-gradient-to-b from-amber-50 to-white border-amber-300 shadow-md transform md:-translate-y-2";
            badgeColor = "bg-amber-400 text-slate-900";
            icon = "fa-crown text-amber-500 text-xl";
          } else if (posReal === 2) {
            bgColor = "bg-slate-50 border-slate-300";
            badgeColor = "bg-slate-300 text-slate-900";
            icon = "fa-medal text-slate-400 text-lg";
          } else if (posReal === 3) {
            bgColor = "bg-orange-50/50 border-orange-200";
            badgeColor = "bg-amber-700 text-white";
            icon = "fa-award text-amber-700 text-lg";
          }

          const nombreLimpio = p.nombreProyecto || 'Sin Nombre';
          const integrantesLimpios = p.integrantes || 'E.E.S.T. N°1';

          const card = document.createElement('div');
          card.className = `${bgColor} p-5 rounded-xl border flex flex-col justify-between text-center space-y-3 relative`;
          card.innerHTML = `
            <div class="space-y-1">
              <div class="flex justify-center items-center gap-1 mb-1">
                <i class="fa-solid ${icon}"></i>
                <span class="text-[10px] font-black uppercase tracking-wider ${badgeColor} px-2.5 py-0.5 rounded-full">${posReal}° LUGAR</span>
              </div>
              <h3 class="font-black text-slate-900 text-sm truncate px-2" title="${nombreLimpio}">${nombreLimpio}</h3>
              <p class="text-[11px] text-slate-500 truncate px-2" title="${integrantesLimpios}">${integrantesLimpios}</p>
            </div>
            <div class="bg-slate-100/70 p-2.5 rounded-lg grid grid-cols-2 gap-2 text-center border border-slate-200/50">
              <div>
                <span class="text-[10px] text-slate-500 font-bold block uppercase">Promedio</span>
                <span class="text-xs font-black text-amber-600">${(parseFloat(p.promedio_publico) || 0).toFixed(1)}</span>
              </div>
              <div>
                <span class="text-[10px] text-slate-500 font-bold block uppercase">Inversión</span>
                <span class="text-xs font-black text-emerald-700">$${(parseFloat(p.total_inversion_simulada) || 0).toLocaleString('es-AR')}</span>
              </div>
            </div>
            <a href="votacion.html?id=${p.proyecto_id}" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded-lg text-xs transition inline-block">
              Ver / Evaluar
            </a>
          `;
          podioContainer.appendChild(card);
        });
      }

      // Renderizar Tabla General con acotación de texto limpia
      ordenados.forEach((p, index) => {
        const pos = index + 1;
        let posBadge = `<span class="font-bold text-slate-500">${pos}°</span>`;
        if (pos === 1) posBadge = `<span class="bg-amber-100 text-amber-800 font-black px-2 py-0.5 rounded-full"><i class="fa-solid fa-crown text-amber-500 mr-1"></i>1°</span>`;
        if (pos === 2) posBadge = `<span class="bg-slate-200 text-slate-800 font-black px-2 py-0.5 rounded-full">2°</span>`;
        if (pos === 3) posBadge = `<span class="bg-amber-900/10 text-amber-900 font-black px-2 py-0.5 rounded-full">3°</span>`;

        const nombreLimpio = p.nombreProyecto || 'Sin Nombre';
        const integrantesLimpios = p.integrantes || 'E.E.S.T. N°1';

        const row = document.createElement('tr');
        row.className = "hover:bg-slate-50 transition";
        row.innerHTML = `
          <td class="p-3 text-center align-middle">${posBadge}</td>
          <td class="p-3 max-w-xs align-middle">
            <span class="font-bold text-slate-900 block truncate" title="${nombreLimpio}">${nombreLimpio}</span>
            <span class="text-[10px] text-slate-500 block truncate" title="${integrantesLimpios}">${integrantesLimpios}</span>
          </td>
          <td class="p-3 text-center font-semibold text-slate-700 align-middle">${p.total_votos || 0}</td>
          <td class="p-3 text-center font-bold text-amber-600 align-middle">${(parseFloat(p.promedio_publico) || 0).toFixed(1)} / 10</td>
          <td class="p-3 text-right font-bold text-emerald-800 align-middle">$${(parseFloat(p.total_inversion_simulada) || 0).toLocaleString('es-AR')}</td>
          <td class="p-3 text-center align-middle">
            <a href="votacion.html?id=${p.proyecto_id}" class="bg-blue-50 hover:bg-blue-100 text-blue-900 font-bold px-3 py-1.5 rounded-lg text-[11px] transition inline-block">
              Votar / Invertir
            </a>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    window.onload = cargarTabla;
  </script>
</body>
</html>
