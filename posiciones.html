<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de Posiciones — E.E.S.T. N°1 Bragado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <header class="bg-slate-900 text-white shadow-lg mb-8">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold tracking-tight">E.E.S.T. N°1 Bragado — Liga de Emprendimientos</h1>
        <p class="text-slate-400 text-xs">Tabla General de Posiciones • Tracción, Inversión y Evaluación Docente</p>
      </div>
      <span id="realtime-status" class="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-3 py-1 rounded-full flex items-center gap-2">
        <i class="fa-solid fa-bolt"></i> En Vivo
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 space-y-6">

    <!-- TARJETAS DE PODIO / TOP 3 -->
    <div id="podio-container" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <!-- Render dinámico Top 3 -->
    </div>

    <!-- TABLA GENERAL -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-trophy text-amber-500"></i> Tabla General de Posiciones
        </h2>
        <button onclick="cargarTabla()" class="text-xs text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> Actualizar
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-100 text-slate-600 uppercase text-[10px] tracking-wider font-bold">
            <tr>
              <th class="p-3 text-center">Pos</th>
              <th class="p-3">Emprendimiento</th>
              <th class="p-3 text-center">Nota Docente</th>
              <th class="p-3 text-center">Votos Público</th>
              <th class="p-3 text-center">Promedio Público</th>
              <th class="p-3 text-right">Inversión Semilla</th>
              <th class="p-3 text-center">Score General</th>
              <th class="p-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-body" class="divide-y divide-slate-200">
            <tr>
              <td colspan="8" class="p-6 text-center text-slate-400 italic">Cargando tabla de posiciones...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://pwwnhxwkmchzkowiwein.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I8C3PrRipAaEfe-Gc_VgkA_2NCUw-Ga";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function cargarTabla() {
      const { data, error } = await _supabase.from('tabla_posiciones').select('*');

      if (error) {
        console.error("Error al cargar posiciones:", error);
        return;
      }

      const tbody = document.getElementById('tabla-body');
      tbody.innerHTML = '';

      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="p-6 text-center text-slate-400 italic">No hay emprendimientos registrados.</td></tr>';
        return;
      }

      data.forEach((p, index) => {
        const pos = index + 1;
        let posBadge = `<span class="font-bold text-slate-500">${pos}°</span>`;
        if (pos === 1) posBadge = `<span class="bg-amber-100 text-amber-800 font-black px-2 py-0.5 rounded-full"><i class="fa-solid fa-crown text-amber-500 mr-1"></i>1°</span>`;
        if (pos === 2) posBadge = `<span class="bg-slate-200 text-slate-800 font-black px-2 py-0.5 rounded-full">2°</span>`;
        if (pos === 3) posBadge = `<span class="bg-amber-900/10 text-amber-900 font-black px-2 py-0.5 rounded-full">3°</span>`;

        const row = document.createElement('tr');
        row.className = "hover:bg-slate-50 transition";
        row.innerHTML = `
          <td class="p-3 text-center">${posBadge}</td>
          <td class="p-3">
            <span class="font-bold text-slate-900 block">${p.nombreProyecto}</span>
            <span class="text-[10px] text-slate-500">${p.integrantes || 'E.E.S.T. N°1'}</span>
          </td>
          <td class="p-3 text-center font-bold text-emerald-700">${(p.nota_docente || 0).toFixed(1)}</td>
          <td class="p-3 text-center font-semibold text-slate-700">${p.total_votos || 0}</td>
          <td class="p-3 text-center font-bold text-amber-600">${(p.promedio_publico || 0).toFixed(1)} / 10</td>
          <td class="p-3 text-right font-bold text-emerald-800">$${(p.total_inversion_simulada || 0).toLocaleString('es-AR')}</td>
          <td class="p-3 text-center">
            <span class="bg-blue-900 text-white font-black text-xs px-2.5 py-1 rounded-lg">${(p.score_general || 0).toFixed(1)}</span>
          </td>
          <td class="p-3 text-center">
            <a href="votacion.html?id=${p.proyecto_id}" class="bg-blue-50 hover:bg-blue-100 text-blue-900 font-bold px-3 py-1.5 rounded-lg text-[11px] transition inline-block">
              Votar / Invertir
            </a>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    window.onload = cargarTabla;
  </script>
</body>
</html>
