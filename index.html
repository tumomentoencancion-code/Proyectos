<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Emprendimientos — Liga Multicurso</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- HEADER CON SELECCIÓN DE ESCUELA / CURSO -->
  <header class="bg-slate-900 text-white shadow-lg mb-8">
    <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 id="portal-institucion" class="text-xl font-bold tracking-tight">E.E.S.T. N°1 Bragado — Liga de Emprendimientos</h1>
        <p id="portal-curso" class="text-slate-400 text-xs">Curso: 7° Año • Tecnicatura en Energías Renovables</p>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <!-- SELECTOR DINÁMICO DE ESCUELA / CURSO -->
        <select id="select-escuela-curso" onchange="seleccionarEscuelaCurso(this.value)" class="bg-slate-800 border border-slate-700 text-white text-xs font-bold rounded-lg px-3 py-2 focus:ring-2 focus:ring-amber-500 w-full sm:w-auto">
          <option value="">🔄 Cargando instituciones y cursos...</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 space-y-8">

    <!-- SECCIÓN DE ACCESOS Y ACCIONES -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <a href="alumno.html" class="bg-blue-900 hover:bg-blue-800 text-white p-5 rounded-2xl shadow-sm border border-blue-800 flex items-center justify-between group transition">
        <div>
          <span class="text-[10px] uppercase font-bold text-blue-300 block">Zona Alumnos</span>
          <h3 class="text-base font-bold">Cargar / Editar Proyecto</h3>
        </div>
        <i class="fa-solid fa-plus-circle text-2xl text-blue-300 group-hover:scale-110 transition"></i>
      </a>

      <a href="posiciones.html" class="bg-amber-500 hover:bg-amber-400 text-slate-950 p-5 rounded-2xl shadow-sm border border-amber-400 flex items-center justify-between group transition">
        <div>
          <span class="text-[10px] uppercase font-bold text-slate-900 block">Ranking & Posiciones</span>
          <h3 class="text-base font-bold">Ver Tabla General</h3>
        </div>
        <i class="fa-solid fa-trophy text-2xl text-slate-900 group-hover:scale-110 transition"></i>
      </a>

      <a href="docente.html" class="bg-slate-800 hover:bg-slate-700 text-white p-5 rounded-2xl shadow-sm border border-slate-700 flex items-center justify-between group transition">
        <div>
          <span class="text-[10px] uppercase font-bold text-slate-400 block">Docentes</span>
          <h3 class="text-base font-bold">Panel de Evaluación</h3>
        </div>
        <i class="fa-solid fa-chalkboard-user text-2xl text-slate-400 group-hover:scale-110 transition"></i>
      </a>
    </div>

    <!-- LISTADO DE PROYECTOS DEL CURSO -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-rocket text-blue-600"></i> Proyectos Participantes del Curso
        </h2>
        <button onclick="cargarProyectosIndex()" class="text-xs text-blue-600 hover:text-blue-800 font-bold flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> Actualizar Lista
        </button>
      </div>

      <div id="grid-proyectos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-xs text-slate-400 italic col-span-3 text-center py-8">Cargando emprendimientos...</p>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://pwwnhxwkmchzkowiwein.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I8C3PrRipAaEfe-Gc_VgkA_2NCUw-Ga";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let institucionActiva = localStorage.getItem('multicurso_institucion') || 'E.E.S.T. N°1 Bragado';
    let cursoActivo = localStorage.getItem('multicurso_curso') || '7° Año • Energías Renovables';

    document.addEventListener("DOMContentLoaded", () => {
      cargarCursosEnSelector();
      actualizarEncabezado();
      cargarProyectosIndex();
    });

    // Carga dinámica desde la tabla docentes de Supabase
    async function cargarCursosEnSelector() {
      const select = document.getElementById('select-escuela-curso');
      const { data: docentes, error } = await _supabase.from('docentes').select('institucion, curso');

      if (error) {
        console.error("Error al cargar docentes/cursos:", error);
        return;
      }

      select.innerHTML = '';

      if (docentes && docentes.length > 0) {
        docentes.forEach(d => {
          const option = document.createElement('option');
          const val = `${d.institucion} - ${d.curso}`;
          option.value = val;
          option.innerText = `🏫 ${d.institucion} (${d.curso})`;
          if (d.institucion === institucionActiva && d.curso === cursoActivo) {
            option.selected = true;
          }
          select.appendChild(option);
        });
      } else {
        select.innerHTML = '<option value="E.E.S.T. N°1 Bragado - 7° Año • Energías Renovables">🏫 E.E.S.T. N°1 Bragado (7° Año • Energías Renovables)</option>';
      }
    }

    function seleccionarEscuelaCurso(valor) {
      if (!valor) return;
      const partes = valor.split(' - ');
      institucionActiva = partes[0];
      cursoActivo = partes[1];

      localStorage.setItem('multicurso_institucion', institucionActiva);
      localStorage.setItem('multicurso_curso', cursoActivo);

      actualizarEncabezado();
      cargarProyectosIndex();
    }

    function actualizarEncabezado() {
      document.getElementById('portal-institucion').innerText = `${institucionActiva} — Liga de Emprendimientos`;
      document.getElementById('portal-curso').innerText = `Curso Activo: ${cursoActivo}`;
    }

    async function cargarProyectosIndex() {
      const grid = document.getElementById('grid-proyectos');
      grid.innerHTML = '<p class="text-xs text-slate-400 italic col-span-3 text-center py-8">Cargando emprendimientos...</p>';

      const { data, error } = await _supabase
        .from('proyectos')
        .select('*')
        .eq('institucion', institucionActiva)
        .eq('curso', cursoActivo)
        .order('id', { ascending: false });

      if (error) {
        grid.innerHTML = '<p class="text-xs text-red-500 italic col-span-3 text-center py-8">Error al cargar proyectos de la base de datos.</p>';
        return;
      }

      grid.innerHTML = '';

      if (!data || data.length === 0) {
        grid.innerHTML = '<p class="text-xs text-slate-400 italic col-span-3 text-center py-8">No hay proyectos registrados para este curso todavía.</p>';
        return;
      }

      data.forEach(p => {
        const nombre = p.nombreProyecto || p.nombre || 'Sin Nombre';
        const slogan = p.slogan || 'Proyecto de Emprendimiento';
        const integrantes = p.integrantes || 'Alumnos del curso';

        const card = document.createElement('div');
        card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col justify-between space-y-3 hover:border-blue-300 transition";
        card.innerHTML = `
          <div class="space-y-1">
            <h3 class="font-bold text-slate-900 text-sm truncate" title="${nombre}">${nombre}</h3>
            <p class="text-[11px] text-blue-700 font-medium truncate">${slogan}</p>
            <p class="text-[10px] text-slate-500 truncate"><i class="fa-solid fa-users mr-1"></i>${integrantes}</p>
          </div>
          <div class="flex gap-2 pt-2 border-t">
            <a href="votacion.html?id=${p.id}" class="flex-1 bg-blue-900 hover:bg-blue-800 text-white font-bold py-1.5 rounded-lg text-[11px] text-center transition">
              Votar / Invertir
            </a>
            <a href="alumno.html?id=${p.id}" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-lg text-[11px] transition">
              Editar
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
