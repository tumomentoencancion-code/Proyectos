<!DOCTYPE html>
<html lang="es" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Portal de Votación — Liga de Emprendimientos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <header class="bg-slate-900 text-white shadow-lg mb-8">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight">E.E.S.T. N°1 Bragado — Emprendimientos</h1>
        <p class="text-slate-400 text-xs">Portal Público de Evaluación e Inversión Simulada</p>
      </div>
      <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-2 transition">
        <i class="fa-solid fa-trophy text-amber-400"></i> Ver Tabla de Posiciones
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6">
    <div id="contenedor-proyecto" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
      <!-- Carga dinámica -->
      <div class="text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
        <p class="text-xs">Cargando datos del proyecto...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://pwwnhxwkmchzkowiwein.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I8C3PrRipAaEfe-Gc_VgkA_2NCUw-Ga";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener("DOMContentLoaded", cargarDetalleVotacion);

    async function cargarDetalleVotacion() {
      const urlParams = new URLSearchParams(window.location.search);
      const idParam = urlParams.get('id');

      if (!idParam) {
        document.getElementById('contenedor-proyecto').innerHTML = `<p class="text-red-500 font-bold text-center">No se especificó ningún proyecto.</p>`;
        return;
      }

      const { data: p, error } = await _supabase.from('proyectos').select('*').eq('id', idParam).single();

      if (error || !p) {
        document.getElementById('contenedor-proyecto').innerHTML = `<p class="text-red-500 font-bold text-center">Error al cargar el proyecto.</p>`;
        return;
      }

      const nombre = p.nombreProyecto || p.nombre || 'Sin título';
      const slogan = p.slogan || '';
      const integrantes = p.integrantes || 'Equipo no especificado';
      const publico = p.publicoObjetivo || p.analisis_mercado || 'Sin descripción';
      
      // Renderización saneada con límites de tipografía
      document.getElementById('contenedor-proyecto').innerHTML = `
        <div class="border-b pb-6 mb-6">
          <span class="text-[10px] font-bold uppercase tracking-wider bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full">PROYECTO #${p.id}</span>
          <h2 class="text-2xl font-black text-slate-900 mt-2 mb-1 leading-snug">${nombre}</h2>
          ${slogan ? `<p class="text-sm font-medium text-slate-500 italic">${slogan}</p>` : ''}
          <p class="text-xs text-slate-600 mt-3"><i class="fa-solid fa-users mr-1 text-slate-400"></i> <strong>Integrantes:</strong> ${integrantes}</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
              <h3 class="text-xs font-bold text-slate-800 uppercase mb-2"><i class="fa-solid fa-bullseye text-blue-600 mr-1.5"></i> Resumen del Emprendimiento</h3>
              <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line">${publico}</p>
            </div>

            ${renderFinanzasPublicas(p)}
          </div>

          <div class="bg-slate-900 text-white p-6 rounded-xl space-y-4 h-fit shadow-md">
            <h3 class="text-sm font-bold uppercase tracking-wider text-amber-400"><i class="fa-solid fa-check-to-slot mr-1.5"></i> Evaluar e Invertir</h3>
            <p class="text-xs text-slate-300">Sumá tu voto cualitativo y simulá tu inversión para este proyecto.</p>

            <button onclick="alert('¡Gracias por evaluar este emprendimiento!')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg text-xs transition shadow">
              <i class="fa-solid fa-star mr-1.5"></i> Votar Proyecto
            </button>
          </div>
        </div>
      `;
    }

    function renderFinanzasPublicas(p) {
      if (p.finanzas_json && p.finanzas_json.costo_producto) {
        const f = p.finanzas_json;
        return `
          <div class="bg-emerald-50 p-5 rounded-xl border border-emerald-200 space-y-3">
            <h3 class="text-xs font-bold text-emerald-900 uppercase"><i class="fa-solid fa-calculator mr-1.5"></i> Estructura Financiera</h3>
            <div class="grid grid-cols-2 gap-3 text-xs font-mono">
              <div class="bg-white p-2.5 rounded border border-emerald-100">
                <span class="text-[10px] text-slate-500 block uppercase">Inversión Inicial</span>
                <strong class="text-slate-800">${f.inversion?.total || '$ ' + (p.inversionInicial || 0)}</strong>
              </div>
              <div class="bg-white p-2.5 rounded border border-emerald-100">
                <span class="text-[10px] text-slate-500 block uppercase">Precio de Venta</span>
                <strong class="text-emerald-700">${f.costo_producto?.precio_venta || '$ ' + (p.precio_venta || 0)}</strong>
              </div>
            </div>
          </div>
        `;
      }
      return '';
    }
  </script>
</body>
</html>
