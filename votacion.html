<!DOCTYPE html>
<html lang="es" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Portal de Votación — Liga de Emprendimientos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <header class="bg-slate-900 text-white shadow-lg mb-8">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-xl font-bold tracking-tight">E.E.S.T. N°1 Bragado — Emprendimientos</h1>
        <p class="text-slate-400 text-xs">Portal Público de Evaluación e Inversión Simulada</p>
      </div>
      <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-2 transition">
        <i class="fa-solid fa-trophy text-amber-400"></i> Ver Tabla de Posiciones
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6">
    <div id="contenedor-proyecto" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
      <div class="text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
        <p class="text-xs">Cargando datos del proyecto...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://pwwnhxwkmchzkowiwein.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I8C3PrRipAaEfe-Gc_VgkA_2NCUw-Ga";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let proyectoId = null;

    document.addEventListener("DOMContentLoaded", cargarDetalleVotacion);

    async function cargarDetalleVotacion() {
      const urlParams = new URLSearchParams(window.location.search);
      proyectoId = urlParams.get('id');

      if (!proyectoId) {
        document.getElementById('contenedor-proyecto').innerHTML = `<p class="text-red-500 font-bold text-center">No se especificó ningún proyecto.</p>`;
        return;
      }

      const { data: p, error } = await _supabase.from('proyectos').select('*').eq('id', proyectoId).single();

      if (error || !p) {
        document.getElementById('contenedor-proyecto').innerHTML = `<p class="text-red-500 font-bold text-center">Error al cargar el proyecto.</p>`;
        return;
      }

      const nombre = p.nombreProyecto || p.nombre || 'Sin título';
      const slogan = p.slogan || '';
      const integrantes = p.integrantes || 'Equipo no especificado';
      const publico = p.publicoObjetivo || p.analisis_mercado || 'Sin descripción';
      
      document.getElementById('contenedor-proyecto').innerHTML = `
        <div class="border-b pb-6 mb-6">
          <span class="text-[10px] font-bold uppercase tracking-wider bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full">PROYECTO #${p.id}</span>
          <h2 class="text-xl font-bold text-slate-900 mt-2 mb-1 leading-snug">${nombre}</h2>
          ${slogan ? `<p class="text-xs font-medium text-slate-500 italic">${slogan}</p>` : ''}
          <p class="text-xs text-slate-600 mt-2"><i class="fa-solid fa-users mr-1 text-slate-400"></i> <strong>Integrantes:</strong> ${integrantes}</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
          
          <!-- COLUMNA IZQUIERDA: DETALLES Y FINANZAS -->
          <div class="lg:col-span-7 space-y-6">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
              <h3 class="text-xs font-bold text-slate-800 uppercase mb-2"><i class="fa-solid fa-bullseye text-blue-600 mr-1.5"></i> Resumen del Emprendimiento</h3>
              <p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line">${publico}</p>
            </div>

            ${renderFinanzasDetalladas(p)}
          </div>

          <!-- COLUMNA DERECHA: VOTACIÓN CUALITATIVA E INVERSIÓN SIMULADA -->
          <div class="lg:col-span-5 space-y-6">
            
            <!-- PANEL VOTACIÓN CUALITATIVA -->
            <div class="bg-white border border-slate-200 p-5 rounded-xl shadow-sm space-y-4">
              <h3 class="text-xs font-bold uppercase text-slate-800 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-500"></i> Evaluación Cualitativa
              </h3>

              <div class="space-y-3 text-xs">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">1. Innovación y Creatividad</label>
                  <select id="voto-innovacion" class="w-full border rounded p-2 text-xs">
                    <option value="5">⭐⭐⭐⭐⭐ Excelente (5 pts)</option>
                    <option value="4" selected>⭐⭐⭐⭐ Muy Bueno (4 pts)</option>
                    <option value="3">⭐⭐⭐ Bueno (3 pts)</option>
                    <option value="2">⭐⭐ Regular (2 pts)</option>
                    <option value="1">⭐ Insuficiente (1 pt)</option>
                  </select>
                </div>

                <div>
                  <label class="block font-bold text-slate-700 mb-1">2. Propuesta de Marketing / Imagen</label>
                  <select id="voto-marketing" class="w-full border rounded p-2 text-xs">
                    <option value="5">⭐⭐⭐⭐⭐ Excelente (5 pts)</option>
                    <option value="4" selected>⭐⭐⭐⭐ Muy Bueno (4 pts)</option>
                    <option value="3">⭐⭐⭐ Bueno (3 pts)</option>
                    <option value="2">⭐⭐ Regular (2 pts)</option>
                    <option value="1">⭐ Insuficiente (1 pt)</option>
                  </select>
                </div>

                <div>
                  <label class="block font-bold text-slate-700 mb-1">3. Viabilidad Técnica y Financiera</label>
                  <select id="voto-viabilidad" class="w-full border rounded p-2 text-xs">
                    <option value="5">⭐⭐⭐⭐⭐ Excelente (5 pts)</option>
                    <option value="4" selected>⭐⭐⭐⭐ Muy Bueno (4 pts)</option>
                    <option value="3">⭐⭐⭐ Bueno (3 pts)</option>
                    <option value="2">⭐⭐ Regular (2 pts)</option>
                    <option value="1">⭐ Insuficiente (1 pt)</option>
                  </select>
                </div>

                <button onclick="enviarVotoCualitativo()" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg text-xs transition shadow mt-2">
                  <i class="fa-solid fa-check-to-slot mr-1.5"></i> Registrar Evaluación
                </button>
              </div>
            </div>

            <!-- PANEL INVERSIÓN SIMULADA -->
            <div class="bg-slate-900 text-white p-5 rounded-xl space-y-4 shadow-md">
              <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-hand-holding-dollar"></i> Inversión Simulada (Ángel Investor)
              </h3>
              <p class="text-[11px] text-slate-300">Simulá cuánto dinero ficticio invertirías en este proyecto para impulsarlo en el ranking comercial.</p>

              <div class="space-y-2 text-xs">
                <label class="block font-medium text-slate-300">Monto a Invertir ($)</label>
                <input type="number" id="monto-inversion" placeholder="Ej: 50000" class="w-full border border-slate-700 bg-slate-800 text-white rounded p-2 font-mono text-xs focus:ring-2 focus:ring-emerald-500">
                <button onclick="enviarInversionSimulada()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-xs transition shadow mt-1">
                  <i class="fa-solid fa-coins mr-1.5"></i> Confirmar Inversión
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function renderFinanzasDetalladas(p) {
      const f = p.finanzas_json || {};
      const inv = f.inversion || {};
      const gas = f.gastos_mensuales || {};
      const prod = f.costo_producto || {};

      return `
        <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 space-y-3">
          <h3 class="text-xs font-bold text-emerald-900 uppercase"><i class="fa-solid fa-calculator mr-1.5"></i> Plan Financiero Resumido</h3>
          <div class="grid grid-cols-2 gap-3 text-xs font-mono">
            <div class="bg-white p-2.5 rounded border border-emerald-100">
              <span class="text-[10px] text-slate-500 block uppercase font-sans">Inversión Requerida</span>
              <strong class="text-slate-800">${inv.total || '$ ' + (p.inversionInicial || 0)}</strong>
            </div>
            <div class="bg-white p-2.5 rounded border border-emerald-100">
              <span class="text-[10px] text-slate-500 block uppercase font-sans">Gastos Fijos Mensuales</span>
              <strong class="text-slate-800">${gas.total || '$ ' + (p.gastos_mensuales || 0)}</strong>
            </div>
            <div class="bg-white p-2.5 rounded border border-emerald-100">
              <span class="text-[10px] text-slate-500 block uppercase font-sans">Precio de Venta</span>
              <strong class="text-emerald-700">${prod.precio_venta || '$ ' + (p.precio_venta || 0)}</strong>
            </div>
            <div class="bg-white p-2.5 rounded border border-emerald-100">
              <span class="text-[10px] text-slate-500 block uppercase font-sans">Punto de Equilibrio</span>
              <strong class="text-emerald-700">${prod.punto_equilibrio || (p.punto_equilibrio || 0) + ' Unidades/mes'}</strong>
            </div>
          </div>
        </div>
      `;
    }

    function enviarVotoCualitativo() {
      alert("¡Evaluación cualitativa registrada con éxito!");
    }

    function enviarInversionSimulada() {
      const monto = document.getElementById('monto-inversion').value;
      if (!monto || monto <= 0) {
        alert("Ingresá un monto válido para invertir.");
        return;
      }
      alert(`¡Inversión simulada de $${monto} registrada correctamente!`);
    }
  </script>
</body>
</html>
