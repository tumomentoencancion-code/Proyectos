<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dossier Ejecutivo — E.E.S.T. N°1 Bragado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @media print {
      @page { size: A4 portrait; margin: 1.2cm 1.5cm 1.5cm 1.5cm; }
      body { background: #ffffff !important; color: #0f172a !important; font-size: 9.5pt !important; }
      .no-print { display: none !important; }
      .pdf-box { page-break-inside: avoid; border: 1px solid #cbd5e1 !important; margin-bottom: 12px !important; }
      .page-break { page-break-before: always !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 sm:p-8">

  <!-- BOTÓN FLOTANTE PARA IMPRIMIR MANUALMENTE SI NO ABRE AUTOMÁTICO -->
  <div class="max-w-4xl mx-auto mb-6 flex justify-between items-center no-print bg-slate-900 text-white p-4 rounded-xl shadow">
    <span class="text-xs font-bold">Vista previa del Dossier Ejecutivo para impresión A4</span>
    <button onclick="window.print()" class="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition flex items-center gap-2">
      <i class="fa-solid fa-print"></i> Imprimir / Guardar como PDF
    </button>
  </div>

  <main id="dossier-contenido" class="max-w-4xl mx-auto space-y-4 bg-white p-6 rounded-xl border border-slate-200">
    <!-- ENCABEZADO INSTITUCIONAL -->
    <div class="border-b-2 border-slate-900 pb-3 mb-4 text-center">
      <h1 class="text-xl font-bold text-slate-900">E.E.S.T. N°1 "Pedro Núñez" — Bragado</h1>
      <p class="text-xs text-slate-600 font-medium">Dossier Técnico Ejecutivo de Plan de Negocios | Ciclo Lectivo 2026</p>
    </div>

    <!-- CARGANDO... -->
    <div id="cargando" class="text-center py-12">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-900 mb-2"></i>
      <p class="text-xs text-slate-500 font-bold">Generando Dossier desde Supabase...</p>
    </div>

    <!-- CONTENEDOR DE LOS 10 PUNTOS -->
    <div id="dossier-items" class="hidden space-y-4">
      <!-- Se inyectan dinámicamente con JS -->
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://pwwnhxwkmchzkowiwein.supabase.co";
    const SUPABASE_KEY = "sb_publishable_I8C3PrRipAaEfe-Gc_VgkA_2NCUw-Ga";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function generarDossier() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (!id) return;

      // Consulta directa de todas las columnas a Supabase
      const { data: p, error } = await _supabase.from('proyectos').select('*').eq('id', id).single();
      const { data: votos } = await _supabase.from('votos_publico').select('puntuacion_promedio').eq('proyecto_id', id);
      const { data: inversiones } = await _supabase.from('inversiones_simuladas').select('monto_invertido').eq('proyecto_id', id);

      if (error || !p) return;

      let totalVotos = votos ? votos.length : 0;
      let sumaPromedios = votos ? votos.reduce((acc, curr) => acc + (parseFloat(curr.puntuacion_promedio) || 0), 0) : 0;
      let promedio = totalVotos > 0 ? (sumaPromedios / totalVotos).toFixed(1) : '0.0';
      let totalInversion = inversiones ? inversiones.reduce((acc, curr) => acc + (parseFloat(curr.monto_invertido) || 0), 0) : 0;

      const html = `
        <!-- ITEM 1 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 1 — Identificación del Emprendimiento</h2>
          <h1 class="text-xl font-black text-slate-900">${p.nombreProyecto || p.nombre}</h1>
          <p class="text-xs italic text-slate-500 mb-2">${p.slogan || '-'}</p>
          <p class="text-xs"><strong>Integrantes:</strong> ${p.integrantes || 'Alumnos de 7° Año'}</p>
        </section>

        <!-- ITEM 2 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 2 — Resumen Ejecutivo y Propuesta de Valor</h2>
          <p class="text-xs text-slate-700 leading-relaxed">${p.publicoObjetivo || p.descripcion || 'Sin especificar.'}</p>
        </section>

        <!-- ITEM 3 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 3 — Estudio de Mercado y Público Objetivo</h2>
          <p class="text-xs text-slate-700 leading-relaxed">${p.estudioMercado || p.publicoObjetivo || 'Análisis de demanda local en Bragado.'}</p>
        </section>

        <!-- ITEM 4 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 4 — Especificaciones Técnicas del Servicio / Producto</h2>
          <p class="text-xs text-slate-700 leading-relaxed">${p.descripcionTecnica || p.descripcion || 'Estándares técnicos y proceso de ejecución.'}</p>
        </section>

        <!-- ITEM 5 -->
        <section class="pdf-box page-break p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 5 — Estrategia Comercial y Marketing</h2>
          <p class="text-xs text-slate-700 leading-relaxed">${p.canalesVenta || 'Canales de distribución y estrategia de comercialización.'}</p>
        </section>

        <!-- ITEM 6 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 6 — Estructura Financiera y Presupuesto</h2>
          <div class="bg-slate-50 p-3 rounded border text-xs font-mono whitespace-pre-line">${p.estructuraFinanciera || p.costos || p.precios || 'Presupuesto y costos integrados en la matriz técnica.'}</div>
        </section>

        <!-- ITEM 7 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 7 — Estructura Legal y Organizativa</h2>
          <p class="text-xs text-slate-700 leading-relaxed">${p.estructuraLegal || 'Encuadre tributario y organización del equipo de trabajo.'}</p>
        </section>

        <!-- ITEM 8 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 8 — Sostenibilidad e Impacto Local</h2>
          <p class="text-xs text-slate-700 leading-relaxed">${p.impactoAmbiental || 'Compromiso ambiental, eficiencia y desarrollo para la comunidad de Bragado.'}</p>
        </section>

        <!-- ITEM 9 -->
        <section class="pdf-box page-break p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 9 — Métricas de Mercado e Inversión Semilla</h2>
          <div class="grid grid-cols-3 gap-4 text-center pt-2">
            <div class="bg-amber-50 p-3 rounded border border-amber-200"><span class="block text-[10px] font-bold text-amber-800">PROMEDIO</span><span class="text-xl font-black text-amber-600">${promedio} / 10</span></div>
            <div class="bg-blue-50 p-3 rounded border border-blue-200"><span class="block text-[10px] font-bold text-blue-800">VOTOS</span><span class="text-xl font-black text-blue-900">${totalVotos}</span></div>
            <div class="bg-emerald-50 p-3 rounded border border-emerald-200"><span class="block text-[10px] font-bold text-emerald-800">CAPITAL SEMILLA</span><span class="text-xl font-black text-emerald-700">$${totalInversion.toLocaleString('es-AR')}</span></div>
          </div>
        </section>

        <!-- ITEM 10 -->
        <section class="pdf-box p-4 rounded-lg border border-slate-200">
          <h2 class="text-xs font-bold uppercase text-blue-900 border-b pb-1 mb-2">ITEM 10 — Evaluación Pedagógica Docente</h2>
          <p class="text-xs text-slate-700">Proyecto evaluado y validado en el marco del Taller de Emprendedurismo de 7° Año.</p>
        </section>
      `;

      document.getElementById('cargando').classList.add('hidden');
      const cont = document.getElementById('dossier-items');
      cont.innerHTML = html;
      cont.classList.remove('hidden');

      // Disparar la ventana de impresión/PDF automáticamente a los 500ms
      setTimeout(() => { window.print(); }, 500);
    }

    window.onload = generarDossier;
  </script>
</body>
</html>
