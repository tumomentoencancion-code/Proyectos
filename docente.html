<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Docente — E.E.S.T. N°1</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold text-amber-400"><i class="fa-solid fa-chalkboard-user mr-2"></i>Panel de Evaluación Docente</h1>
        <p class="text-xs text-slate-400">E.E.S.T. N°1 Bragado • Seguimiento de Proyectos de 7° Año</p>
      </div>
      <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-lg text-slate-300 transition">
        <i class="fa-solid fa-house mr-1"></i> Volver al Inicio
      </a>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- COLUMNA IZQUIERDA: LISTA DE PROYECTOS/ALUMNOS -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col h-[650px]">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-base text-white"><i class="fa-solid fa-folder-open text-amber-400 mr-2"></i>Proyectos Registrados</h2>
          <span id="total-proyectos" class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-300">0</span>
        </div>
        <input type="text" id="filtro-docente" onkeyup="filtrarProyectos()" placeholder="Buscar por nombre o integrante..." class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-xs text-white mb-3">
        <div id="lista-proyectos-docente" class="space-y-2 overflow-y-auto flex-1 pr-1">
          <p class="text-xs text-slate-400 text-center py-4">Cargando lista de proyectos...</p>
        </div>
      </div>

      <!-- COLUMNA DERECHA: PANEL DE EVALUACIÓN Y DETALLES -->
      <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700">
        <div id="sin-seleccion" class="text-center py-24 text-slate-500">
          <i class="fa-solid fa-file-signature text-5xl mb-3 opacity-50"></i>
          <p class="text-sm">Selecciona un proyecto de la columna izquierda para evaluarlo o ver sus detalles.</p>
        </div>

        <div id="panel-evaluacion" class="hidden space-y-6">
          <div class="border-b border-slate-700 pb-4 flex justify-between items-start">
            <div>
              <span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded font-mono" id="eval-id">ID: -</span>
              <h3 id="eval-titulo" class="text-xl font-bold text-white mt-1">---</h3>
              <p id="eval-integrantes" class="text-xs text-slate-300 mt-1"><i class="fa-solid fa-users mr-1"></i>---</p>
            </div>
            <a id="eval-link-doc" href="#" target="_blank" class="hidden text-xs bg-blue-900/60 hover:bg-blue-800 text-blue-200 border border-blue-700 px-3 py-1.5 rounded transition flex items-center gap-1">
              <i class="fa-solid fa-arrow-up-right-from-square"></i> Documentación
            </a>
          </div>

          <form id="form-guardar-evaluacion" class="space-y-4">
            <input type="hidden" id="eval-proyecto-id">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Nota Etapas 1-5</label>
                <input type="number" id="nota-etapa1" step="0.1" min="0" max="10" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Nota Etapas 6-10</label>
                <input type="number" id="nota-etapa2" step="0.1" min="0" max="10" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white">
              </div>
              <div>
                <label class="block text-xs font-semibold text-amber-400 mb-1">% Avance / Nota Final</label>
                <input type="number" id="nota-final" step="1" min="0" max="100" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-amber-400 font-bold">
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Estado del Proyecto</label>
              <select id="estado-revision" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white">
                <option value="En Revisión">En Revisión</option>
                <option value="Aprobado">Aprobado</option>
                <option value="Requiere Correcciones">Requiere Correcciones</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Devolución / Reseña Docente</label>
              <textarea id="devolucion-texto" rows="4" placeholder="Escribe aquí los comentarios y sugerencias para el grupo..." class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm text-white"></textarea>
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-lg transition shadow-lg flex items-center justify-center gap-2">
              <i class="fa-solid fa-floppy-disk"></i>
              <span>Guardar Evaluación</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pwwnhxwkmchzkowiwein.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_I8C3PrRipAaEfe-Gc_VgkA_2NCUw-Ga";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let proyectosGlobales = [];

    async function cargarProyectosDocente() {
      const { data, error } = await db.from('proyectos').select('*').order('created_at', { ascending: false });
      if (error) {
        alert("Error al cargar proyectos: " + error.message);
        return;
      }

      proyectosGlobales = data || [];
      document.getElementById('total-proyectos').innerText = proyectosGlobales.length;
      renderizarListaProyectos(proyectosGlobales);
    }

    function renderizarListaProyectos(lista) {
      const contenedor = document.getElementById('lista-proyectos-docente');
      contenedor.innerHTML = '';

      if (lista.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No hay proyectos para mostrar.</p>';
        return;
      }

      lista.forEach(p => {
        const item = document.createElement('div');
        item.className = "p-3 bg-slate-700/40 hover:bg-slate-700 rounded-lg border border-slate-600/50 transition cursor-pointer flex justify-between items-center";
        item.onclick = () => seleccionarProyectoDocente(p.id);
        item.innerHTML = `
          <div>
            <div class="font-bold text-sm text-white">${p.nombre_proyecto || 'Sin Nombre'}</div>
            <div class="text-xs text-slate-400"><i class="fa-solid fa-id-badge text-amber-400/80 mr-1"></i>ID: ${p.id} • ${p.integrantes || 'Sin integrantes'}</div>
          </div>
          <button class="text-xs bg-amber-500/20 text-amber-300 hover:bg-amber-500 hover:text-slate-900 font-semibold px-2.5 py-1 rounded transition">
            Evaluar
          </button>
        `;
        contenedor.appendChild(item);
      });
    }

    function filtrarProyectos() {
      const texto = document.getElementById('filtro-docente').value.toLowerCase();
      const filtrados = proyectosGlobales.filter(p => 
        (p.nombre_proyecto && p.nombre_proyecto.toLowerCase().includes(texto)) ||
        (p.integrantes && p.integrantes.toLowerCase().includes(texto)) ||
        p.id.toString().includes(texto)
      );
      renderizarListaProyectos(filtrados);
    }

    async function seleccionarProyectoDocente(id) {
      const p = proyectosGlobales.find(proj => proj.id === id);
      if (!p) return;

      document.getElementById('sin-seleccion').classList.add('hidden');
      document.getElementById('panel-evaluacion').classList.remove('hidden');

      document.getElementById('eval-proyecto-id').value = p.id;
      document.getElementById('eval-id').innerText = `ID: ${p.id}`;
      document.getElementById('eval-titulo').innerText = p.nombre_proyecto || 'Sin título';
      document.getElementById('eval-integrantes').innerText = `Integrantes: ${p.integrantes || 'Sin especificar'}`;

      const btnDoc = document.getElementById('eval-link-doc');
      if (p.link_documentacion) {
        btnDoc.href = p.link_documentacion;
        btnDoc.classList.remove('hidden');
      } else {
        btnDoc.classList.add('hidden');
      }

      // Buscar si ya existe una evaluación guardada en la base de datos
      const { data: evalData } = await db.from('evaluaciones').select('*').eq('proyecto_id', id).maybeSingle();

      if (evalData) {
        document.getElementById('nota-etapa1').value = evalData.nota_etapa1_5 || 0;
        document.getElementById('nota-etapa2').value = evalData.nota_etapa6_10 || 0;
        document.getElementById('nota-final').value = evalData.nota_final !== null ? evalData.nota_final : (p.avance_porcentaje || 0);
        document.getElementById('estado-revision').value = evalData.estado_revision || 'En Revisión';
        document.getElementById('devolucion-texto').value = evalData.devolucion_docente || '';
      } else {
        document.getElementById('nota-etapa1').value = 0;
        document.getElementById('nota-etapa2').value = 0;
        document.getElementById('nota-final').value = p.avance_porcentaje || 0;
        document.getElementById('estado-revision').value = 'En Revisión';
        document.getElementById('devolucion-texto').value = '';
      }
    }

    document.getElementById('form-guardar-evaluacion').onsubmit = async (e) => {
      e.preventDefault();
      const proyecto_id = parseInt(document.getElementById('eval-proyecto-id').value);

      const payload = {
        proyecto_id: proyecto_id,
        nota_etapa1_5: parseFloat(document.getElementById('nota-etapa1').value) || 0,
        nota_etapa6_10: parseFloat(document.getElementById('nota-etapa2').value) || 0,
        nota_final: parseFloat(document.getElementById('nota-final').value) || 0,
        estado_revision: document.getElementById('estado-revision').value,
        devolucion_docente: document.getElementById('devolucion-texto').value
      };

      // Guardar en Supabase usando UPSERT (actualiza si existe, crea si no)
      const { error } = await db.from('evaluaciones').upsert(payload, { onConflict: 'proyecto_id' });

      if (error) {
        alert("Error al guardar la evaluación: " + error.message);
      } else {
        alert("¡Evaluación guardada con éxito!");
        cargarProyectosDocente();
      }
    };

    window.onload = cargarProyectosDocente;
  </script>
</body>
</html>
